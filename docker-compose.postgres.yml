services:
  postgres:
    image: postgres:16-alpine
    container_name: nhl-coaching-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nhl_coaching
      POSTGRES_USER: nhl_app
      POSTGRES_PASSWORD: change-me-local-only
    ports:
      - "5432:5432"
    volumes:
      - nhl_coaching_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nhl_app -d nhl_coaching"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  nhl_coaching_data:
